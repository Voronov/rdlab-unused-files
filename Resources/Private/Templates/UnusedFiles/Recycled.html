<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:be="http://typo3.org/ns/TYPO3/CMS/Backend/ViewHelpers"
      xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:layout name="Module" />

<f:section name="Content">
    <f:variable name="lll" value="LLL:EXT:rdlab_unused_files/Resources/Private/Language/locallang.xlf:" />

    <h1><f:translate key="{lll}recycled.title" /></h1>
    <p><f:translate key="{lll}recycled.intro" /></p>

    <f:if condition="{files}">
        <f:then>
            <form method="post" action="{formUri}">
                <input type="hidden" name="action" value="restore" />
                <input type="hidden" name="page" value="{page}" />
                <f:if condition="{folderId}">
                    <input type="hidden" name="id" value="{folderId}" />
                </f:if>
                <div class="table-fit">
                    <table class="table table-striped table-hover mb-0">
                        <thead>
                            <tr>
                                <th><f:translate key="{lll}list.file" /></th>
                                <th><f:translate key="{lll}recycled.originalFolder" /></th>
                                <th class="text-end"><f:translate key="{lll}list.size" /></th>
                                <th><f:translate key="{lll}recycled.deletedAt" /></th>
                                <th><f:translate key="{lll}recycled.deletedBy" /></th>
                                <th class="col-control"></th>
                            </tr>
                        </thead>
                        <tbody>
                            <f:for each="{files}" as="file">
                                <tr>
                                    <td>{file.name}</td>
                                    <td>{file.originalFolder}</td>
                                    <td class="text-end text-nowrap">{file.size -> f:format.bytes()}</td>
                                    <td class="text-nowrap">{file.deletedAt -> f:format.date(format: 'Y-m-d H:i')}</td>
                                    <td>{file.deletedBy}</td>
                                    <td class="col-control">
                                        <button type="submit" name="restore" value="{file.uid}" class="btn btn-default btn-sm" title="{f:translate(key: '{lll}recycled.restore')}">
                                            <core:icon identifier="actions-edit-undo" size="small" />
                                            <f:translate key="{lll}recycled.restore" />
                                        </button>
                                    </td>
                                </tr>
                            </f:for>
                        </tbody>
                    </table>
                </div>
            </form>

            <f:if condition="{pageCount} > 1">
                <nav aria-label="pagination" class="mt-3">
                    <ul class="pagination">
                        <li class="page-item {f:if(condition: '!{previousUri}', then: 'disabled')}">
                            <a class="page-link" href="{previousUri}" title="{f:translate(key: '{lll}pagination.previous')}"><core:icon identifier="actions-chevron-start" size="small" /></a>
                        </li>
                        <li class="page-item {f:if(condition: '!{nextUri}', then: 'disabled')}">
                            <a class="page-link" href="{nextUri}" title="{f:translate(key: '{lll}pagination.next')}"><core:icon identifier="actions-chevron-end" size="small" /></a>
                        </li>
                        <li class="page-item disabled">
                            <span class="page-link"><f:translate key="{lll}pagination.info" arguments="{0: page, 1: pageCount}" /></span>
                        </li>
                    </ul>
                </nav>
            </f:if>
        </f:then>
        <f:else>
            <div class="callout callout-success">
                <div class="callout-body"><f:translate key="{lll}recycled.empty" /></div>
            </div>
        </f:else>
    </f:if>
</f:section>
</html>
