<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:be="http://typo3.org/ns/TYPO3/CMS/Backend/ViewHelpers"
      xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:layout name="Module" />

<f:section name="Content">
    <f:variable name="lll" value="LLL:EXT:rdlab_unused_files/Resources/Private/Language/locallang.xlf:" />

    <h1><f:translate key="{lll}module.title" /></h1>
    <p><f:translate key="{lll}module.intro" /></p>

    <f:if condition="{referenceIndexStale}">
        <f:then>
            <div class="callout callout-warning">
                <div class="callout-body">
                    <f:if condition="{referenceIndexLastUpdate}">
                        <f:then>
                            <f:translate key="{lll}referenceIndex.stale" arguments="{0: '{referenceIndexLastUpdate -> f:format.date(format: \'Y-m-d H:i\')}', 1: referenceIndexMaxAgeHours}" />
                        </f:then>
                        <f:else>
                            <f:translate key="{lll}referenceIndex.never" />
                        </f:else>
                    </f:if>
                </div>
            </div>
        </f:then>
        <f:else>
            <div class="callout callout-info">
                <div class="callout-body">
                    <f:translate key="{lll}referenceIndex.updated" arguments="{0: '{referenceIndexLastUpdate -> f:format.date(format: \'Y-m-d H:i\')}'}" />
                </div>
            </div>
        </f:else>
    </f:if>

    <div class="panel panel-default">
        <div class="panel-heading"><f:translate key="{lll}filter.title" /></div>
        <div class="panel-body">
            <form method="post" action="{listUri}" class="row g-3 align-items-end">
                <input type="hidden" name="action" value="filter" />
                <f:if condition="{folderId}">
                    <input type="hidden" name="id" value="{folderId}" />
                </f:if>
                <div class="col-md-3">
                    <label class="form-label"><f:translate key="{lll}filter.folder" /></label>
                    <div class="form-control-plaintext">
                        <f:if condition="{scopeLabel}">
                            <f:then><core:icon identifier="apps-filetree-folder-default" size="small" /> {scopeLabel}</f:then>
                            <f:else><f:translate key="{lll}filter.folder.all" /></f:else>
                        </f:if>
                    </div>
                </div>
                <div class="col-md-2">
                    <label class="form-label" for="rdlab-filter-extension"><f:translate key="{lll}filter.extension" /></label>
                    <select class="form-select" id="rdlab-filter-extension" name="filter[extension]">
                        <option value=""><f:translate key="{lll}filter.extension.all" /></option>
                        <f:for each="{extensions}" as="extension">
                            <option value="{extension}" {f:if(condition: '{extension} == {filter.extension}', then: 'selected="selected"')}>{extension}</option>
                        </f:for>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label" for="rdlab-filter-min-age"><f:translate key="{lll}filter.minAgeDays" /></label>
                    <input type="number" min="0" class="form-control" id="rdlab-filter-min-age" name="filter[minAgeDays]" value="{f:if(condition: filter.minAgeDays, then: filter.minAgeDays)}" />
                </div>
                <div class="col-md-3">
                    <label class="form-label" for="rdlab-filter-search"><f:translate key="{lll}filter.search" /></label>
                    <input type="text" class="form-control" id="rdlab-filter-search" name="filter[search]" value="{filter.search}" />
                </div>
                <div class="col-md-2">
                    <label class="form-label" for="rdlab-filter-items-per-page"><f:translate key="{lll}filter.itemsPerPage" /></label>
                    <select class="form-select" id="rdlab-filter-items-per-page" name="filter[itemsPerPage]">
                        <f:for each="{itemsPerPageOptions}" as="option">
                            <option value="{option}" {f:if(condition: '{option} == {filter.itemsPerPage}', then: 'selected="selected"')}>{option}</option>
                        </f:for>
                    </select>
                </div>
                <div class="col-md-3">
                    <button type="submit" class="btn btn-primary">
                        <core:icon identifier="actions-filter" size="small" />
                        <f:translate key="{lll}filter.apply" />
                    </button>
                    <f:if condition="{filter.active}">
                        <a href="{resetUri}" class="btn btn-default"><f:translate key="{lll}filter.reset" /></a>
                    </f:if>
                </div>
            </form>
        </div>
    </div>

    <p>
        <strong><f:translate key="{lll}summary" arguments="{0: total, 1: '{totalSize -> f:format.bytes()}'}" /></strong><br />
        <small class="text-body-secondary">
            <f:if condition="{scopeLabel}">
                <f:then><f:translate key="{lll}summary.scope" arguments="{0: scopeLabel}" /></f:then>
                <f:else><f:translate key="{lll}summary.scope.all" /></f:else>
            </f:if>
            <f:translate key="{lll}summary.excluded" arguments="{0: '{excludedFolders -> f:join(separator: \', \')}'}" />
        </small>
    </p>

    <f:if condition="{files}">
        <f:then>
            <form method="post"
                  action="{listUri}"
                  id="rdlab-unused-files-form"
                  data-total="{total}"
                  data-bulk-delete-limit="{bulkDeleteLimit}"
                  data-label-banner-page="{f:translate(key: '{lll}selection.page')}"
                  data-label-banner-select-all="{f:translate(key: '{lll}selection.selectAll')}"
                  data-label-banner-all="{f:translate(key: '{lll}selection.all')}"
                  data-label-banner-clear="{f:translate(key: '{lll}selection.clear')}"
                  data-label-confirm-selected="{f:translate(key: '{lll}delete.selected.confirm')}"
                  data-label-confirm-all="{f:translate(key: '{lll}delete.all.confirm')}"
                  data-label-button="{f:translate(key: '{lll}delete.selected')}">
                <f:if condition="{folderId}">
                    <input type="hidden" name="id" value="{folderId}" />
                </f:if>
                <f:for each="{filterValues}" as="value" key="key">
                    <input type="hidden" name="filter[{key}]" value="{value}" />
                </f:for>
                <input type="hidden" name="selectAll" value="0" />

                <div class="alert alert-info d-none" data-rdlab-selection-banner>
                    <span data-rdlab-selection-text></span>
                    <a href="#" class="alert-link" data-rdlab-selection-action></a>
                </div>

                <div class="table-fit">
                    <table class="table table-striped table-hover mb-0" id="rdlab-unused-files-table">
                        <thead>
                            <tr>
                                <th class="col-checkbox">
                                    <span class="form-check form-check-type-toggle">
                                        <input type="checkbox" class="form-check-input" data-rdlab-toggle-all="1" title="{f:translate(key: '{lll}list.toggleAll')}" />
                                    </span>
                                </th>
                                <th><f:translate key="{lll}list.file" /></th>
                                <th><f:translate key="{lll}list.folder" /></th>
                                <th><f:translate key="{lll}list.type" /></th>
                                <th class="text-end"><f:translate key="{lll}list.size" /></th>
                                <th><f:translate key="{lll}list.created" /></th>
                                <th><f:translate key="{lll}list.modified" /></th>
                                <th><f:translate key="{lll}list.status" /></th>
                                <th class="col-control"></th>
                            </tr>
                        </thead>
                        <tbody>
                            <f:for each="{files}" as="file">
                                <tr>
                                    <td class="col-checkbox">
                                        <span class="form-check form-check-type-toggle">
                                            <input type="checkbox" class="form-check-input" name="files[]" value="{file.uid}" />
                                        </span>
                                    </td>
                                    <td>
                                        <core:icon identifier="{file.iconIdentifier}" size="small" />
                                        <f:if condition="{file.publicUrl}">
                                            <f:then>
                                                <a href="{file.publicUrl}" target="_blank" rel="noopener" title="{f:translate(key: '{lll}list.openFile')}">{file.name}</a>
                                            </f:then>
                                            <f:else>
                                                {file.name}
                                            </f:else>
                                        </f:if>
                                    </td>
                                    <td>
                                        <a href="{be:moduleLink(route: 'media_management', arguments: '{id: file.combinedFolderIdentifier}')}" title="{f:translate(key: '{lll}list.showFolder')}">
                                            <f:if condition="{multipleStorages}">{file.storageName}:</f:if>{file.folder}
                                        </a>
                                    </td>
                                    <td>{file.extension}</td>
                                    <td class="text-end text-nowrap">{file.size -> f:format.bytes()}</td>
                                    <td class="text-nowrap">{file.createdAt -> f:format.date(format: 'Y-m-d H:i')}</td>
                                    <td class="text-nowrap">{file.modifiedAt -> f:format.date(format: 'Y-m-d H:i')}</td>
                                    <td><span class="badge badge-success"><f:translate key="{lll}list.status.unreferenced" /></span></td>
                                    <td class="col-control">
                                        <button type="submit"
                                                name="deleteSingle"
                                                value="{file.uid}"
                                                class="btn btn-default btn-sm t3js-modal-trigger"
                                                title="{f:translate(key: '{lll}delete.single')}"
                                                data-severity="warning"
                                                data-title="{f:translate(key: '{lll}delete.confirm.title')}"
                                                data-bs-content="{f:translate(key: '{lll}delete.single.confirm', arguments: '{0: file.identifier}')}"
                                                data-button-ok-text="{f:translate(key: '{lll}delete.confirm.ok')}"
                                                data-button-close-text="{f:translate(key: '{lll}delete.confirm.cancel')}">
                                            <core:icon identifier="actions-delete" size="small" />
                                        </button>
                                    </td>
                                </tr>
                            </f:for>
                        </tbody>
                    </table>
                </div>

                <div class="mt-3 mb-3">
                    <button type="submit"
                            name="action"
                            value="deleteSelected"
                            class="btn btn-danger t3js-modal-trigger"
                            disabled="disabled"
                            data-rdlab-delete-selected
                            data-severity="error"
                            data-title="{f:translate(key: '{lll}delete.confirm.title')}"
                            data-bs-content="{f:translate(key: '{lll}delete.selected.confirm')}"
                            data-button-ok-text="{f:translate(key: '{lll}delete.confirm.ok')}"
                            data-button-close-text="{f:translate(key: '{lll}delete.confirm.cancel')}">
                        <core:icon identifier="actions-delete" size="small" />
                        <span data-rdlab-delete-selected-label><f:translate key="{lll}delete.selected" /></span>
                    </button>
                </div>
            </form>

            <f:if condition="{pagination.pageCount} > 1">
                <nav aria-label="pagination">
                    <ul class="pagination">
                        <li class="page-item {f:if(condition: '!{pagination.firstUri}', then: 'disabled')}">
                            <a class="page-link" href="{pagination.firstUri}" title="{f:translate(key: '{lll}pagination.first')}"><core:icon identifier="actions-chevron-bar-start" size="small" /></a>
                        </li>
                        <li class="page-item {f:if(condition: '!{pagination.previousUri}', then: 'disabled')}">
                            <a class="page-link" href="{pagination.previousUri}" title="{f:translate(key: '{lll}pagination.previous')}"><core:icon identifier="actions-chevron-start" size="small" /></a>
                        </li>
                        <f:for each="{pagination.window}" as="item">
                            <li class="page-item {f:if(condition: item.current, then: 'active')}">
                                <a class="page-link" href="{item.uri}">{item.page}</a>
                            </li>
                        </f:for>
                        <li class="page-item {f:if(condition: '!{pagination.nextUri}', then: 'disabled')}">
                            <a class="page-link" href="{pagination.nextUri}" title="{f:translate(key: '{lll}pagination.next')}"><core:icon identifier="actions-chevron-end" size="small" /></a>
                        </li>
                        <li class="page-item {f:if(condition: '!{pagination.lastUri}', then: 'disabled')}">
                            <a class="page-link" href="{pagination.lastUri}" title="{f:translate(key: '{lll}pagination.last')}"><core:icon identifier="actions-chevron-bar-end" size="small" /></a>
                        </li>
                        <li class="page-item disabled">
                            <span class="page-link"><f:translate key="{lll}pagination.info" arguments="{0: pagination.current, 1: pagination.pageCount}" /></span>
                        </li>
                    </ul>
                </nav>
            </f:if>
        </f:then>
        <f:else>
            <div class="callout callout-success">
                <div class="callout-body"><f:translate key="{lll}list.empty" /></div>
            </div>
        </f:else>
    </f:if>
</f:section>
</html>
